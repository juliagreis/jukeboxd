<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Jukeboxd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<main id="main" class="auth">
  <div class="auth__art">
    <div class="disc"></div>
    <p class="auth__quote">“Todo álbum que você escuta conta uma história. O Jukeboxd guarda todas elas.”</p>
  </div>
  <div class="auth__form">
    <div class="auth__form-inner">
      <a class="nav__brand" href="index.html"><span class="vinyl"></span> Jukeboxd</a>
      <h1>Bem-vindo de volta</h1>
      <p>Entre para ver suas resenhas, listas e o que seus amigos andam ouvindo.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" required autocomplete="email">
          <span class="field__error" id="email-error"></span>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Sua senha" required minlength="6" autocomplete="current-password">
          <span class="field__error" id="password-error"></span>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Entrar</button>
      </form>

      <div class="auth__divider">ou</div>
      <button class="btn btn--ghost btn--block" type="button" id="guest-btn">Continuar como visitante</button>

      <p class="auth__switch">Ainda não tem conta? <a href="register.html">Cadastre-se</a></p>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
