<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — Jukeboxd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<main id="main" class="auth">
  <div class="auth__art">
    <div class="disc"></div>
    <p class="auth__quote">“Comece hoje o seu diário musical — daqui a um ano, olhe para trás e reviva cada fase.”</p>
  </div>
  <div class="auth__form">
    <div class="auth__form-inner">
      <a class="nav__brand" href="index.html"><span class="vinyl"></span> Jukeboxd</a>
      <h1>Crie sua conta</h1>
      <p>Leva menos de um minuto. Sem cartão, sem complicação.</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" placeholder="Como podemos te chamar" required autocomplete="name">
          <span class="field__error" id="name-error"></span>
        </div>
        <div class="field">
          <label for="handle">Nome de usuário</label>
          <input type="text" id="handle" name="handle" placeholder="@seunome" required pattern="^@?[a-zA-Z0-9_\.]{3,20}$">
          <span class="field__error" id="handle-error"></span>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" required autocomplete="email">
          <span class="field__error" id="email-error"></span>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
          <span class="field__hint">Usaremos bcrypt para nunca guardar sua senha em texto puro.</span>
          <span class="field__error" id="password-error"></span>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Criar conta</button>
      </form>

      <p class="auth__switch">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>
</main>
<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
