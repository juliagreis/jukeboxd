<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listas — Jukeboxd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Pular para o conteúdo</a>

<header class="site-header">
  <div class="container nav">
    <a class="nav__brand" href="index.html"><span class="vinyl"></span> Jukeboxd</a>
    <button class="nav__toggle" aria-label="Abrir menu" aria-expanded="false">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <nav class="nav__links" aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="search.html">Buscar</a>
      <a href="lists.html" class="is-active">Listas</a>
      <a href="stats.html">Estatísticas</a>
    </nav>
    <form class="nav__search" role="search" action="search.html">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor"/><path d="M11 11l3 3" stroke="currentColor" stroke-linecap="round"/></svg>
      <input type="search" name="q" placeholder="Buscar músicas, álbuns, artistas…" aria-label="Buscar">
    </form>
    <div class="nav__actions">
      <a class="nav__avatar" href="profile.html" aria-label="Meu perfil" data-current-user-initial>M</a>
    </div>
  </div>
</header>

<main id="main">
  <div class="container">
    <div class="list-toolbar">
      <div>
        <h1 style="font-size:2rem;font-style:italic">Listas da comunidade</h1>
        <p style="color:var(--text-muted);margin-top:6px">Curadorias criadas por quem também vive de música.</p>
      </div>
      <button class="btn btn--primary" id="new-list-btn" type="button">+ Nova lista</button>
    </div>

    <div class="search-tabs" role="tablist" aria-label="Filtrar listas">
      <button class="is-active" data-filter="all" role="tab" aria-selected="true">Todas</button>
      <button data-filter="mine" role="tab" aria-selected="false">Minhas listas</button>
      <button data-filter="popular" role="tab" aria-selected="false">Mais curtidas</button>
    </div>

    <div class="grid-lists" id="lists-grid" style="margin-top:26px"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <span>© 2026 Jukeboxd. Catálogo musical via MusicBrainz.</span>
    <nav aria-label="Links do rodapé">
      <a href="index.html">Início</a>
      <a href="search.html">Buscar</a>
      <a href="stats.html">Estatísticas</a>
    </nav>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/lists.js"></script>
</body>
</html>
